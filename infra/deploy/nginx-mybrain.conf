# mybrain.rlz.cl — nginx en el servidor de dev, detras de Cloudflare (proxied).
# TLS de origen: certificado self-signed de 10 anios (Cloudflare en modo "Full"
# lo acepta; NO usar "Full (strict)" salvo que instales un Origin Certificate de CF).
# Instalar en /etc/nginx/sites-available/mybrain.conf + symlink a sites-enabled.

server {
    listen 80;
    server_name mybrain.rlz.cl;
    # ACME/HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    # Sintaxis "listen ... http2" (deprecada pero universal): la directiva
    # "http2 on;" requiere nginx >= 1.25 y Ubuntu LTS trae 1.18/1.24.
    listen 443 ssl http2;
    server_name mybrain.rlz.cl;

    ssl_certificate     /etc/nginx/ssl/mybrain.crt;
    ssl_certificate_key /etc/nginx/ssl/mybrain.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare -> origen: restaurar IP real del visitante para el rate-limit
    # del gateway (/registro). El snippet lo genera deploy.sh al desplegar
    # desde https://www.cloudflare.com/ips-v4 y /ips-v6 (con fallback a una
    # lista fija si la descarga falla).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # MCP streamable HTTP usa SSE: sin buffering y timeouts largos
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
