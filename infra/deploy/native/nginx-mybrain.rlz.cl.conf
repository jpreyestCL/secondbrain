server {
    listen 80;
    server_name mybrain.rlz.cl;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name mybrain.rlz.cl;

    ssl_certificate     /etc/nginx/ssl/mybrain.crt;
    ssl_certificate_key /etc/nginx/ssl/mybrain.key;

    # Solo confiar en CF-Connecting-IP cuando el peer ES Cloudflare;
    # de lo contrario un atacante que llegue al origen por IP falsifica
    # la cabecera y anula el rate-limit del gateway.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Solo Cloudflare puede hablar con este vhost: sin esto, cualquiera
    # golpea el origen por IP saltandose WAF/rate-limit del edge y
    # falsificando CF-Connecting-IP. NO afecta a los demas sitios.
    if ($cf_peer = 0) { return 403; }

    # SIN auth_basic: este vhost es publico (lo protege el OAuth del gateway)
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Reescribir siempre con la IP real resuelta por real_ip
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
