# Config del Graphiti MCP server (montado en /app/mcp/config/config.yaml).
# Derivado de mcp_server/config/config-docker-falkordb.yaml del repo getzep/graphiti
# (version graphiti 0.28.2 / imagen 1.0.2). La sintaxis ${VAR:default} la resuelve
# el loader de configuracion del propio server contra las variables de entorno.

server:
  transport: "http"          # streamable HTTP; endpoint MCP en /mcp/
  host: "0.0.0.0"            # dentro del contenedor; afuera solo 127.0.0.1:8020
  port: 8000

llm:
  provider: ${LLM_PROVIDER:openai}
  # Modelo de CHAT. Variable propia (LLM_MODEL) para poder alternar de proveedor
  # sin tocar la config de NVIDIA que vive en MODEL_NAME/OPENAI_*.
  model: ${LLM_MODEL}
  max_tokens: 4096

  providers:
    openai:
      # Credenciales del CHAT, independientes de las del embedder. Esto permite
      # tener, a la vez: chat en OpenAI (gpt-4o-mini) y embeddings en NVIDIA
      # (nv-embed-v1, 4096 dims), que es lo que exige un grafo ya indexado.
      api_key: ${LLM_API_KEY}
      api_url: ${LLM_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      api_url: ${ANTHROPIC_API_URL:https://api.anthropic.com}
      max_retries: 3

embedder:
  provider: ${EMBEDDER_PROVIDER:openai}
  model: ${EMBEDDER_MODEL:text-embedding-3-small}
  dimensions: ${EMBEDDER_DIMENSIONS:1536}

  providers:
    openai:
      # Clave PROPIA del embedder (OBLIGATORIA si se define): permite chat en un
      # proveedor (p.ej. OpenAI gpt-4o-mini) y embeddings en otro (NVIDIA
      # nv-embed-v1, 4096 dims). El loader NO soporta ${VAR:${OTRA}} anidado, asi
      # que hay que fijarla explicitamente en mcp.env.
      # OJO: cambiar el proveedor/dimension de embeddings de un grafo existente
      # CORROMPE la busqueda semantica.
      api_key: ${EMBEDDER_API_KEY}
      # URL propia del embedder: permite LLM=DeepSeek (sin embeddings) +
      # embeddings en Ollama u OpenAI. Si no se define, api.openai.com.
      api_url: ${EMBEDDER_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

    voyage:
      api_key: ${VOYAGE_API_KEY}
      api_url: ${VOYAGE_API_URL:https://api.voyageai.com/v1}
      model: "voyage-3"

database:
  provider: "falkordb"

  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://falkordb:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:default_db}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
  # Ontologia ajustada a un cerebro de VIDA PERSONAL, no al ejemplo generico de
  # upstream. El original traia Topic y Object ("use as last resort"), que
  # legitiman abstracciones, y no tenia un tipo Persona.
  #
  # El efecto se midio: con la ontologia generica, las tres entidades mas
  # conectadas del grafo eran "General Partner" (43), "Partnership" (40) y
  # "Limited Partners" (38) — roles y conceptos del articulado de los
  # contratos — por delante de la sociedad real (36) y del dueño (14). Buscar
  # "socios" devolvia el concepto antes que a las personas.
  #
  # Cada descripcion dice tambien lo que NO es: el extractor sigue esas pistas.
  entity_types:
    - name: "Persona"
      description: "Un ser humano concreto, identificado por su nombre propio (ej: Juan Pablo Reyes Tollini, Dra. Laura Diaz). NO es un rol ni una parte de un contrato: 'General Partner', 'el comprador', 'Receiving Party' o 'el cliente' NO son personas."
    - name: "Organizacion"
      description: "Una empresa, sociedad, banco, clinica, institucion publica o estudio de abogados, identificada por su razon social (ej: Inversiones Linets SpA, Banco de Chile, Internal Revenue Service). NO son organizaciones las figuras juridicas genericas como 'Partnership', 'LP' o 'sociedad anonima'."
    - name: "Lugar"
      description: "Un lugar concreto: direccion, ciudad, pais, propiedad o inmueble (ej: Av. Alameda Cinco 66-W Colina, Ontario, depto 510). NO es un lugar una jurisdiccion mencionada solo como marco legal."
    - name: "Documento"
      description: "Un documento identificable: contrato, escritura, factura, examen medico, declaracion de impuestos, poder, certificado. Suele tener numero, fecha o partes concretas. NO son documentos las clausulas ni los tipos genericos de documento ('Agreement', 'Notice', 'Sale Notice')."
    - name: "Cuenta"
      description: "Una cuenta bancaria, de inversion o tributaria, con su numero o identificador (ej: cuenta corriente 123-456, EIN 98-1707887, RUT de una sociedad)."
    - name: "Activo"
      description: "Un bien concreto del que se es dueño: inmueble, vehiculo, participacion societaria con su porcentaje, inversion. NO son activos los conceptos como 'Percentage Interest' o 'acciones' en abstracto."
    - name: "Obligacion"
      description: "Una deuda, credito, arriendo o compromiso de pago concreto, con monto o contraparte (ej: credito hipotecario con el Banco X, deuda de 45 millones con Corfo)."
    - name: "Evento"
      description: "Un hecho ocurrido en una fecha: reunion, viaje, firma, cirugia, mudanza, pago. NO son eventos los procedimientos descritos en abstracto."
    - name: "Condicion"
      description: "Un diagnostico, tratamiento, medicamento o condicion de salud concreta."
    - name: "Credencial"
      description: "La REFERENCIA a una credencial que existe y donde esta guardada — nunca su valor. El valor se redacta antes de llegar aqui."
